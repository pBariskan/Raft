name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race detector, short chaos run)
        run: go test -race -short ./...
      - name: test (full chaos run)
        run: go test ./...
      - name: chaos runner, fixed seed set
        run: go run ./cmd/chaos -seeds 1000
